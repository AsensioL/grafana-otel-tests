server:
  # This section ensures Tempo listens on all interfaces
  http_listen_address: 0.0.0.0
  http_listen_port: 3200
  grpc_listen_address: 0.0.0.0
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          # Change from default (localhost) to 0.0.0.0
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo
    wal:
      path: /var/tempo/wal

# Add support for streaming traces over HTTP
stream_over_http_enabled: true

# Add metric generator for traces
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: production

  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

  processor:
    span_metrics:
      # These dimensions allow you to filter metrics by service or operation
      dimensions:
        - http.method
        - http.status_code
        - db.system
    service_graphs:
      max_items: 10000
    local_blocks:
      # Required for TraceQL metrics and metric queries within Tempo
      filter_server_spans: true
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
