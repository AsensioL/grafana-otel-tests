name: grafana-otel-tests

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "3000:3000"
    environment:
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}/
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN}
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_INSTALL_PLUGINS: "nline-plotlyjs-panel"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.9.1
    restart: unless-stopped
    mem_limit: 768m
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # ports:
    #   - "9090:9090" # Don't expose web portal

  loki:
    image: grafana/loki:3.6
    restart: unless-stopped
    mem_limit: 4g
    environment:
      # Soft cap so Go GCs before Docker OOM-kills the container.
      GOMEMLIMIT: 3600MiB
    # command: -config.file=/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml
      - loki-data:/loki
    logging: *default-logging
    # No healthcheck, the image is distroless
    # ports:
    #   - "3100:3100" # Don't expose web portal

  # Tempo image is a distroless image (lacks CMD tools, runs as user instead of
  # root), and using a volume at /var/tempo causes the folder to be owned by
  # root (uid=0), however Tempo needs to its owner (uid=10001).
  # This container fixes the folder ownership issue during start up
  tempo-init:
    image: busybox:1.37
    user: root
    command: ["chown", "-R", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-data:/var/tempo

  tempo:
    image: grafana/tempo:2.10.8
    restart: unless-stopped
    mem_limit: 768m
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml
      - tempo-data:/var/tempo # see tempo-init volume fix
    logging: *default-logging
    # No healthcheck, the image is distroless
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    # ports:
    #   - "3200:3200" # Don't expose Tempo HTTP / query API (Grafana uses this internally)

  alloy:
    image: grafana/alloy:v1.12.2
    restart: unless-stopped
    mem_limit: 512m
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/12345 && printf \"GET /-/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \"200\"'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:4317:4317" # App runs on this machine, so only expose these to localhost
      - "127.0.0.1:4318:4318" # App runs on this machine, so only expose these to localhost
      # - "12345:12345" # Don't expose web portal

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  tempo-data:
